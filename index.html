<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Autobattler</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #151922; color: #eef1f6; font: 400 16px/1.45 "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
main { width: 100%; max-width: 360px; background: #1d232f; border-radius: 16px; padding: 22px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 26px; letter-spacing: .03em; text-transform: uppercase; }
p { margin: 0; color: #9aa4b8; }
form { display: grid; gap: 8px; }
label { font-size: 13px; color: #9aa4b8; }
input { font: inherit; background: #0c0f15; color: #eef1f6; border: 1px solid #384357; border-radius: 10px; padding: 10px 12px; width: 100%; }
button { font: 700 15px inherit; background: #f2ede2; color: #1a1d25; border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
:focus-visible { outline: 2px solid #eef1f6; outline-offset: 2px; }
#msg { min-height: 1.45em; color: #e5503f; }
#msg.busy { color: #9aa4b8; }
</style>
</head>

    <button type="submit" id="go">Unlock</button>
  </form>
  <p id="msg" role="status"></p>
</main>

  const KEY = 'autobattler-pass';
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msgEl = document.getElementById('msg'), go = document.getElementById('go'), pw = document.getElementById('pw');
  const say = (text, busy) => { msgEl.textContent = text; msgEl.classList.toggle('busy', !!busy); };

  async function decryptPage(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  async function unlock(password, remembered) {
    if (!window.crypto || !crypto.subtle) { say('This browser cannot unlock the page here. Open it over https.'); return; }
    go.disabled = true;
    say('Unlocking.', true);
    try {
      const html = await decryptPage(password);
      try { sessionStorage.setItem(KEY, password); } catch (e) { /* storage unavailable */ }
      document.open(); document.write(html); document.close();
    } catch (e) {
      go.disabled = false;
      try { sessionStorage.removeItem(KEY); } catch (e2) { /* storage unavailable */ }
      say(remembered ? '' : 'That password did not work. Check it and try again.');
      if (!remembered) pw.select();
    }
  }

  document.getElementById('unlock').addEventListener('submit', e => {
    e.preventDefault();
    if (pw.value) unlock(pw.value, false);
  });

  // Same tab, already unlocked once: skip the prompt after a reload.
  let saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) { /* storage unavailable */ }
  if (saved) unlock(saved, true);
})();
